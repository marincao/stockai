services:
  - type: web
    name: stockai-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: STOCKAI_DB_PATH
        value: /var/data/stockai.db
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
    disk:
      name: stockai-data
      mountPath: /var/data
      sizeGB: 1
